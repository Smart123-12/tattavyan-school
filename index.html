<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tattavyan School ERP - Luminous Academic Dashboard</title>
  <!-- SEO Best Practices -->
  <meta name="description" content="Tattavyan School ERP is a state-of-the-art academic management portal styled with Google Stitch aesthetics, offering full student, teacher, and admin interaction panels.">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="react-backup/public/favicon.svg" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- Core Dynamic Application Container -->
  <div id="app">
    <!-- Loader before JS mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f4f6fc; font-family: sans-serif;">
      <div style="border: 4px solid rgba(0, 74, 198, 0.1); border-top: 4px solid #004ac6; border-radius: 50%; width: 44px; height: 44px; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
      <div style="font-size: 16px; font-weight: 600; color: #131b2e;">Loading Tattavyan ERP Portal...</div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
